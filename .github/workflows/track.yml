name: Flugpreis-Tracker Open-Jaw FRA-MEL / CHC-FRA

on:
  # "Seltener, breiter": 1x taeglich, dafuer mehrere Datumskombinationen pro Lauf
  # (budget.searches_per_run in config.yaml). Uhrzeit variiert zusaetzlich per Jitter.
  # Der Budget-Waechter in der DB begrenzt die SerpApi-Requests hart auf < 100/Monat.
  schedule:
    - cron: "17 8 * * *"    # ~09:17 / 10:17 Berlin
  workflow_dispatch:
    inputs:
      no_jitter:
        description: "Zufaellige Wartezeit ueberspringen (sofort abfragen)"
        type: boolean
        default: true

concurrency:
  group: flugpreise-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Flugpreise abfragen und speichern
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.no_jitter }}" = "true" ]; then
            python -m flugpreise.tracker --no-jitter
          else
            python -m flugpreise.tracker
          fi

      - name: Ergebnisse committen
        run: |
          git config user.name  "flugpreise-bot"
          git config user.email "actions@github.com"
          git add data/flugpreise.db docs/index.html
          if git diff --staged --quiet; then
            echo "Keine Aenderungen zu committen."
          else
            git commit -m "chore: Flugpreis-Abfrage $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
